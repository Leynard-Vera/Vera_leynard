<!DOCTYPE html>
<html>

<head>
    <title>Contact - Recommended Places</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

</header>

<main>

    <h1>Contact Me</h1>

    <p>
        Have a question about one of the recommended places?
        You can send me a message using the form below.
    </p>

    <form>

        <fieldset>

            <legend>Your details</legend>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <br><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="subject">Subject</label>
            <select id="subject" name="subject">

                <option value="suggest-place">Suggest a place</option>
                <option value="correct-detail">Correct a detail</option>
                <option value="ask-question">Ask a question</option>
                <option value="something-else">Something else</option>

            </select>

            <br><br>

            <label for="message">Message</label>

            <br>

            <textarea
                id="message"
                name="message"
                rows="6"
                cols="40"
                required></textarea>

            <br><br>

            <button type="submit">Send message</button>

        </fieldset>

    </form>

</main>

<footer>

    <p>&copy; 2026 Recommended Places</p>

</footer>

</body>
</html>
